name: Govee2MQTT Bridge (Fork)
image: ghcr.io/florianhorner/govee2mqtt-{arch}
version: "2026.08.06-bf75797f"
slug: govee2mqtt
stage: experimental
description: Fork of wez/govee2mqtt with device fixes, crash hardening, and scene cycling. Prefer upstream unless you need these specific changes.
url: https://github.com/florianhorner/govee2mqtt-extended
arch:
  - amd64
  - aarch64
init: false
startup: services
services:
  - mqtt:need

apparmor: true

webui: http://[HOST]:[PORT:8056]/assets/index.html
#ingress: true
#ingress_port: 8056

# Host network access is required for LAN discovery
host_network: true

map:
  - type: addon_config
    read_only: false
    path: /app/config

options:
  temperature_scale: "C"

schema:
  temperature_scale: "str?"
  govee_email: "str?"
  govee_password: "password?"
  govee_2fa_code: "password?"
  govee_api_key: "password?"
  mqtt_host: "str?"
  mqtt_port: "int?"
  mqtt_username: "str?"
  mqtt_password: "password?"
  debug_level: "str?"
  no_multicast: "bool?"
  broadcast_all: "bool?"
  global_broadcast: "bool?"
  scan: "str?"
  lan_query_attempts: "int(1,100)?"
  lan_query_backoff_ms: "int(1,3000)?"
  lan_breaker_threshold: "int(0,)?"
  lan_breaker_cooldown: "int(30,900)?"
  disable_effects: "bool?"
  allowed_effects: "str?"
  music_palette: "bool?"
