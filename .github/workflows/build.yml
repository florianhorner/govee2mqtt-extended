name: Container Build

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    tags:
      - "20*"
    branches:
      - main
    paths:
      - "**/*.rs"
      - "addon/**"
      - "**/Cargo.*"
      - ".github/workflows/build.yml"
      - ".cargo/config.toml"
      - "scripts/build-cross.sh"
      - "scripts/build-docker.sh"
      - "Dockerfile"
      - ".dockerignore"

env:
  IMAGE: ghcr.io/florianhorner/govee2mqtt
  # The composable HA build actions do NOT read addon/build.yaml, so the labels
  # and the base-image cosign identity that lived there have to be passed
  # explicitly. Kept here so the addon and test-addon jobs cannot drift apart.
  ADDON_LABELS: |
    io.hass.type=addon
    io.hass.name=Govee2MQTT Bridge (Fork)
    io.hass.description=Fork of wez/govee2mqtt with device fixes, crash hardening, and scene cycling.
    io.hass.url=https://github.com/florianhorner/govee2mqtt-extended
    org.opencontainers.image.title=Home Assistant App: Govee2MQTT Bridge
    org.opencontainers.image.description=Bridges Govee smart home devices to Home Assistant via MQTT.
    org.opencontainers.image.licenses=MIT
  ADDON_BASE_IDENTITY: https://github.com/home-assistant/docker-base/.*

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Docker meta
        if: ${{ github.event_name != 'pull_request' }}
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch,enable=${{ github.ref != 'refs/heads/main' }}
            type=ref,event=pr
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to the Container registry
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v4
        with:
          registry: https://ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: "Install Rust"
        uses: dtolnay/rust-toolchain@stable
      - name: "Install cross from Cargo"
        uses: baptiste0928/cargo-install@v3
        with:
          crate: "cross"
      - name: Build executable
        run: ./scripts/build-cross.sh ${{ matrix.platform }}
      - name: Build No Push
        if: ${{ github.event_name == 'pull_request' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
      - name: Build and push by digest
        if: ${{ github.event_name != 'pull_request' }}
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          push: ${{ github.event_name != 'pull_request' }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        if: ${{ github.event_name != 'pull_request' }}
        id: digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
          echo "DIGEST_NAME=$(echo ${{ matrix.platform }} | sed 's,/,-,g')" >> $GITHUB_OUTPUT
      - name: Upload digest
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ steps.digest.outputs.DIGEST_NAME }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    needs:
      - build
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          merge-multiple: true
          path: /tmp/digests
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch,enable=${{ github.ref != 'refs/heads/main' }}
            type=ref,event=tag,enable=${{ github.ref_type == 'tag' }}
            type=ref,event=pr
      - name: Login to GHCR
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v4
        with:
          registry: https://ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            ${{ github.event_name == 'pull_request' && '--dry-run' || '' }} \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)
      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
  addon:
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    runs-on: ${{ matrix.os }}
    needs:
      - merge
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      # Hard-coded rather than derived from
      # home-assistant/builder/actions/prepare-multi-arch-matrix: that action
      # emits {arch}-{name} (amd64-govee2mqtt), the inverse of the
      # govee2mqtt-{arch} names addon/config.yaml points installed Supervisors
      # at. The arch -> runner mapping mirrors that action, so aarch64 builds
      # natively instead of under QEMU.
      matrix:
        include:
          - arch: amd64
            os: ubuntu-24.04
            image: ghcr.io/florianhorner/govee2mqtt-amd64
          - arch: aarch64
            os: ubuntu-24.04-arm
            image: ghcr.io/florianhorner/govee2mqtt-aarch64
    steps:
      # persist-credentials: false — nothing here runs an authenticated git
      # command. apply-tag.sh only reads local history (git show -s), and the
      # registry login is a separate docker/login-action inside build-image.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      # The published image tag is the addon/config.yaml version, NOT the git
      # tag name: Supervisor pulls ghcr.io/florianhorner/govee2mqtt-{arch} at
      # whatever version addon/config.yaml declares. apply-tag.sh derives that
      # from the HEAD commit, so it stays the source of truth here. Publishing
      # github.ref_name instead would 404 for every install whenever the two
      # differ (e.g. the bare 2026.03.22 tag published 2026.03.22-ba238f5e).
      # Body kept byte-identical to the "Rehearse the release version step" in
      # test-addon, which is the only pre-release coverage this job gets.
      # GitHub has no step reuse without a composite action, so the duplication
      # is deliberate — change both or neither.
      - name: Apply tag to version
        id: version
        run: |
          ./scripts/apply-tag.sh
          version="$(sed -n 's/^version: *"\([^"]*\)".*/\1/p' addon/config.yaml)"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}-[0-9a-f]{7,}$'; then
            echo "::error::addon/config.yaml version is missing or malformed: '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # Replaces home-assistant/builder@2026.03.2. The monolithic action is
      # deprecated and no builder image was ever published for 2026.06.0, so
      # no version of it has both an image and a cosign new enough to read the
      # signatures home-assistant/docker-base applied on 2026-06-16. The
      # composable actions install current cosign themselves, which restores
      # base-image verification instead of skipping it (--no-cosign-verify).
      - name: Build and Publish Home Assistant Add On
        uses: home-assistant/builder/actions/build-image@2026.06.0
        with:
          arch: ${{ matrix.arch }}
          context: addon
          image: ${{ matrix.image }}
          image-tags: |
            ${{ steps.version.outputs.version }}
            latest
          version: ${{ steps.version.outputs.version }}
          push: "true"
          cosign: "true"
          cosign-base-verify: ghcr.io/home-assistant/${{ matrix.arch }}-base-debian:bookworm
          cosign-base-identity: ${{ env.ADDON_BASE_IDENTITY }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          # build-image does not read addon/build.yaml; BUILD_FROM must match
          # the build_from: entry there so CI and Supervisor local builds agree.
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/${{ matrix.arch }}-base-debian:bookworm
          labels: ${{ env.ADDON_LABELS }}

  test-addon:
    if: ${{ ! ( github.event_name == 'push' && github.ref_type == 'tag' ) }}
    runs-on: ${{ matrix.os }}
    needs:
      # Note! Despite the dependency edge here to the build steps above,
      # this test-addon build flow will build the addon from the latest
      # images that were published to ghcr.io, which is NOT the ones we
      # build here because we don't push those when we trigger the conditions
      # for this to build.
      # Thats "OK" because the addon build doesn't actually run anything
      # from that container image.
      # The test-addon flow is validating that the addon build configuration
      # looks plausible, so the prior image should be sufficient for that.
      # If you are reading this and know how to get the bits above funnelled
      # into the hass build below, and it isn't eye-bleedingly-gnarly, then
      # please submit a PR!
      - build
    permissions:
      contents: read
      # No id-token: keyless `cosign verify` needs no OIDC token, and with
      # push: false build-image never reaches its signing step.
      packages: read
    strategy:
      fail-fast: false
      # Same hard-coded matrix as the addon job above; see the rationale there.
      matrix:
        include:
          - arch: amd64
            os: ubuntu-24.04
            image: ghcr.io/florianhorner/govee2mqtt-amd64
          - arch: aarch64
            os: ubuntu-24.04-arm
            image: ghcr.io/florianhorner/govee2mqtt-aarch64
    steps:
      # persist-credentials: false — same rationale as the addon job above.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      # build-image only logs in when push is true, and addon/Dockerfile pulls
      # ghcr.io/florianhorner/govee2mqtt:latest, so log in explicitly here.
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: https://ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # build-image gates its own base-image verify on push == true, so a
      # push: false job would silently skip the very check that is failing
      # today. Verify the base explicitly instead.
      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2
      - name: Verify base image
        uses: home-assistant/builder/actions/cosign-verify@2026.06.0
        with:
          image: ghcr.io/home-assistant/${{ matrix.arch }}-base-debian:bookworm
          cosign-identity: ${{ env.ADDON_BASE_IDENTITY }}
      # cosign stays "true" even though nothing is published: signing is gated
      # on push == true, while cosign: "false" would make build-image pull the
      # ghcr registry cache WITHOUT verifying its signature. Cache verification
      # is allow-failure, so a warning here never reddens the job.
      - name: Test Build Home Assistant Add On
        uses: home-assistant/builder/actions/build-image@2026.06.0
        with:
          arch: ${{ matrix.arch }}
          context: addon
          image: ${{ matrix.image }}
          image-tags: test
          version: test
          push: "false"
          cosign: "true"
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/${{ matrix.arch }}-base-debian:bookworm
          labels: ${{ env.ADDON_LABELS }}
      # The addon job runs on tag pushes only, so the one piece of hand-written
      # logic in the release path -- reading the version back out of
      # addon/config.yaml after apply-tag.sh rewrites it -- would otherwise first
      # execute during a live release. Rehearse it here so a broken parse fails a
      # PR instead. Runs last because apply-tag.sh mutates addon/config.yaml,
      # which sits inside the build context used above.
      - name: Rehearse the release version step
        env:
          IMAGE_NAME: ${{ matrix.image }}
        run: |
          ./scripts/apply-tag.sh
          version="$(sed -n 's/^version: *"\([^"]*\)".*/\1/p' addon/config.yaml)"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}-[0-9a-f]{7,}$'; then
            echo "::error::addon/config.yaml version is missing or malformed: '$version'"
            exit 1
          fi
          echo "Release would publish ${IMAGE_NAME}:${version}"
