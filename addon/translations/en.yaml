---
configuration:
  temperature_scale:
    name: Temperature Scale
    description: >-
      Which temperature scale to display in Home Assistant.
      Enter "C" for Celsius or "F" for Fahrenheit.
  govee_email:
    name: Govee Account Email
    description: >-
      Your Govee account email address. Needed for room names, scenes,
      and devices without LAN support. Requires internet on startup.
  govee_password:
    name: Govee Account Password
    description: >-
      Your Govee account password. Used only to authenticate with
      Govee's servers — never sent anywhere else.
  govee_2fa_code:
    name: Govee 2FA Code
    description: >-
      Leave blank on first start. If Govee requires 2FA, the add-on
      requests a code by email. Paste it here and restart within about
      15 minutes. If Govee rejects it, clear the field and restart
      without a code to request another.
  govee_api_key:
    name: Govee API Key
    description: >-
      Your Govee developer API key. Enables scene control, segment
      colors, and music modes. Get one free at
      https://developer.govee.com/reference/apply-you-govee-api-key.
      Requires internet on startup.

  mqtt_host:
    name: MQTT Broker Host
    description: >-
      Host name or IP address of your MQTT broker.
      Leave blank if you use the Mosquitto app — Home Assistant
      fills this in automatically.
  mqtt_port:
    name: MQTT Broker Port
    description: >-
      Port number of your MQTT broker (default: 1883).
      Leave blank if you use the Mosquitto app.
  mqtt_username:
    name: MQTT Username
    description: >-
      Username for your MQTT broker, if it requires authentication.
      Leave blank if you use the Mosquitto app.
  mqtt_password:
    name: MQTT Password
    description: >-
      Password for your MQTT broker, if it requires authentication.
      Leave blank if you use the Mosquitto app.
  debug_level:
    name: Log Verbosity
    description: >-
      Only needed for troubleshooting. Enter "govee=trace" for
      maximum detail. Warning: trace mode may include passwords
      and other sensitive data in the log. Remove any sensitive
      information before sharing logs with others.
  no_multicast:
    name: Disable Multicast Discovery
    description: >-
      Disables the standard multicast method for finding Govee
      devices on your network. Only enable this if you are using
      one of the alternative discovery methods below.
  broadcast_all:
    name: Broadcast to Each Network Interface
    description: >-
      Alternative discovery method: sends a discovery packet to
      every network interface on your system. Try this if the
      default multicast discovery does not find your devices.
  scan:
    name: Scan Specific IP Addresses
    description: >-
      Comma-separated list of IP addresses to scan directly.
      Use this to target specific Govee devices (assign them
      static IPs first) or broadcast addresses for other subnets.
  global_broadcast:
    name: Global Broadcast Discovery
    description: >-
      Sends discovery packets to 255.255.255.255. Rarely helps
      if standard multicast already fails — try "Broadcast to
      Each Network Interface" or "Scan Specific IP Addresses"
      instead.
  lan_query_attempts:
    name: LAN Status Query Attempts
    description: >-
      How many times a device status query is sent before giving
      up (default 3). Raising this tolerates slower devices at the
      cost of more Wi-Fi traffic when devices don't respond.
  lan_query_backoff_ms:
    name: LAN Status Query Backoff (ms)
    description: >-
      Wait after the first status query attempt, in milliseconds
      (default 350). Doubles on each retry, capped at 3000 ms.
  lan_breaker_threshold:
    name: LAN Poll Circuit Breaker Threshold
    description: >-
      After this many consecutive status-query timeouts, background
      polling of that device is suspended for a cooldown period
      (default 3). Set to 0 to disable the circuit breaker.
      Commands you send and their confirmation polls are never
      blocked by this.
  lan_breaker_cooldown:
    name: LAN Poll Circuit Breaker Cooldown (s)
    description: >-
      How long background polling of an unresponsive device stays
      suspended, in seconds (default 300, clamped to 30-900).
      Doubles on repeated failure, capped at 900 s. A device that
      shows any sign of life gets an immediate probe, and the first
      successful status reply lifts the suspension.
  disable_effects:
    name: Disable Effects
    description: >-
      Set to true to disable publishing effect lists for all devices to MQTT discovery.
      This can fix issues with the Google Home Integration payload limits.
  allowed_effects:
    name: Allowed Effects
    description: >-
      A comma-separated list of effect names to allow (e.g. "Aurora,Rainbow").
      If set, only effects matching these names will be published to MQTT discovery.
      This helps reduce the payload size while still allowing some effects.
  music_palette:
    name: Music Mode Palettes (LAN)
    description: >-
      Set to true to enable the gv2mqtt/<id>/set-music-palette command topic,
      which programs music mode with your own colours over the LAN API.
      Off by default: the frames are reverse-engineered and only mapped for a
      few SKUs. See docs/MUSIC_MODE.md for the supported devices and the
      payload format.

