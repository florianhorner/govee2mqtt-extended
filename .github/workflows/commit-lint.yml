# Managed by commit-lint-kit-v1. Generated; do not edit by hand.
name: commit-lint

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

jobs:
  commit-lint:
    name: commit-lint / validate commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The script reads the pull request from the event file, so its title
      # never appears in this step's logged environment.
      - name: Validate commit messages and pull request title
        run: bash .config/commit-lint/validate-pr.sh
